[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-coder-agent"
version = "1.0.0"
description = "Evidence-first clinical coding harnesses behind one stable API."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "redis>=5.2,<7.0",
  "httpx>=0.27,<1.0",
  "langgraph>=0.6,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0"]

[tool.setuptools.packages.find]
include = ["clinical_coder*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
